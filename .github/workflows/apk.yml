name: APK e Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test del motore audio e dell'analisi
        run: |
          node tests/engine.test.js
          node tests/analysis.test.js
          python3 tests/firmware_test.py

      - name: Copia l'app negli asset dell'APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web
          rm -f android/app/src/main/assets/web/sw.js

      - name: Compila l'APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease -PversionCode=${{ github.run_number }}

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/release/app-release.apk solco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: solco-apk
          path: solco.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara l'app per Windows
        shell: bash
        run: |
          rm -rf desktop/web
          cp -r web desktop/web
          rm -f desktop/web/sw.js
          cd desktop
          npm version --no-git-tag-version --allow-same-version 1.0.${{ github.run_number }}
          npm install --no-audit --no-fund

      - name: Compila l'installer
        working-directory: desktop
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Prova automatica su Windows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'desktop/dist/win-unpacked/SOLCO.exe'
          $out = Join-Path $env:RUNNER_TEMP 'prova.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'nessun esito scritto' }
          if ($p.ExitCode -ne 0) { throw "prova fallita (codice $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: solco-exe
          path: desktop/dist/SOLCO-Setup.exe

  puck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti Arduino, core ESP32 e librerie
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          mkdir -p "$HOME/Arduino/libraries" && cd "$HOME/Arduino/libraries"
          git clone -q --depth 1 -b 2.5.2 https://github.com/h2zero/NimBLE-Arduino
          git clone -q --depth 1 -b 0.3.0 https://github.com/m5stack/M5Unified
          git clone -q --depth 1 -b 0.3.0 https://github.com/m5stack/M5GFX
          pip install -q esptool
      - name: Compila il firmware del puck (M5StickS3)
        run: |
          arduino-cli compile --warnings default \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=disabled \
            --output-dir build firmware/puck/solco_puck
          ls -la build
          if [ ! -f build/solco_puck.ino.merged.bin ]; then
            B0=$(ls ~/.arduino15/packages/esp32/hardware/esp32/*/tools/partitions/boot_app0.bin | head -1)
            python3 -m esptool --chip esp32s3 merge_bin -o build/solco_puck.ino.merged.bin \
              0x0 build/solco_puck.ino.bootloader.bin 0x8000 build/solco_puck.ino.partitions.bin \
              0xe000 "$B0" 0x10000 build/solco_puck.ino.bin
          fi
          cp build/solco_puck.ino.merged.bin solco-puck.bin
          cp hardware/stampa/porta_puck.stl porta-puck.stl
      - uses: actions/upload-artifact@v4
        with:
          name: solco-puck
          path: |
            solco-puck.bin
            porta-puck.stl
  release:
    needs: [build, windows, puck]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Pubblica la versione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SOLCO 1.0.${{ github.run_number }}
          body: |
            **Tablet Android**: scarica **solco.apk** dal tablet e aprilo per installarlo (la prima volta Android chiede di permettere l'installazione da questa fonte).

            **Windows (Galaxy Book)**: scarica **SOLCO-Setup.exe** e aprilo. Se compare «Windows ha protetto il PC», tocca «Ulteriori informazioni» e poi «Esegui comunque».
            **Puck del giradischi (M5StickS3)**: **solco-puck.bin** è il programma da caricare sul puck, **porta-puck.stl** il supporto da stampare. Istruzioni nel README, sezione «Giradischi come controller».
          files: |
            art/solco.apk
            art/SOLCO-Setup.exe
            art/solco-puck.bin
            art/porta-puck.stl
          fail_on_unmatched_files: false
          make_latest: true
